name: Stadium Review Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate and apply approved stadium reviews
        run: python3 Tribunetour/scripts/sync-stadium-review.py apply-approved

      - name: Commit approved stadium changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Tribunetour/stadiums.csv Tribunetour/stadium_review.csv Tribunetour/stadium_review_log.json
          if git diff --cached --quiet; then
            echo "No approved stadium changes."
            exit 0
          fi
          git commit -m "chore: apply approved stadium reviews"
          git push origin HEAD:main
